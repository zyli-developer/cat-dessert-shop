<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一起开猫店 · 打烊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-close" viewBox="0 0 24 24"><g class="ic" stroke-width="2.8"><path d="M7 7l10 10"/><path d="M17 7L7 17"/></g></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l13 7-13 7z" fill="currentColor"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5S3.5 14.8 3.5 9a4.2 4.2 0 0 1 8.5-1 4.2 4.2 0 0 1 8.5 1c0 5.8-8.5 11.5-8.5 11.5z" fill="currentColor"/></symbol>
</defs></svg>

<div class="stage">
  <img class="stage__bg" src="assets/bg/bg_game.png" alt="">
  <div class="overlay">
    <div class="dialog pop">
      <img class="dialog__cat" src="assets/character/cat_white_bye.png" alt="">
      <button class="iconbtn dialog__close" onclick="location.href='home.html'" aria-label="关闭"><svg><use href="#i-close"/></svg></button>

      <div class="title-lg" style="font-size:58px;margin-top:14px">今天先打烊啦</div>
      <div class="muted" style="font-size:30px;font-weight:600;margin-top:8px">还差 1 位猫客的订单没做完~</div>

      <!-- 进度 -->
      <div class="panel--sand panel" style="padding:22px 26px;border-radius:24px;margin-top:28px">
        <div class="row between" style="margin-bottom:12px">
          <span class="mute2" style="font-weight:700;font-size:26px">完成订单</span>
          <span class="h-display" style="font-size:34px;color:var(--pink-dp)">3 / 4</span>
        </div>
        <div class="bar"><i style="width:75%;background:linear-gradient(180deg,var(--pink-hi),var(--pink))"></i></div>
      </div>

      <!-- 复活：看广告 -->
      <button class="btn btn--mint btn--block" style="margin-top:30px;height:108px">
        <svg style="width:32px;height:32px;color:#C0364B"><use href="#i-heart"/></svg>看广告，清空上半区复活
        <span class="badge-ad" style="background:rgba(255,255,255,.4)"><svg style="width:22px;height:22px;color:#1F5B41"><use href="#i-play"/></svg>30s</span>
      </button>

      <div class="row" style="gap:18px;margin-top:18px">
        <button class="btn btn--ghost" style="flex:1;height:96px;font-size:32px" onclick="location.href='home.html'">返回首页</button>
        <button class="btn btn--primary" style="flex:1.3;height:96px" onclick="location.href='game.html'">再试一次</button>
      </div>
    </div>
  </div>
</div>

<script src="js/stage.js"></script>
</body>
</html>
