<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一起开猫店 · 排行榜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  .seg{ display:flex; gap:8px; padding:8px; background:var(--sand); border-radius:var(--r-pill);
    box-shadow:inset 0 2px 6px rgba(120,80,40,.12); }
  .seg button{ flex:1; height:72px; border:none; border-radius:var(--r-pill); cursor:pointer;
    font-family:var(--font-display); font-weight:800; font-size:32px; color:var(--ink-soft); background:transparent; }
  .seg button.on{ background:var(--paper-2); color:var(--ink);
    box-shadow:var(--shadow-sm), inset 0 0 0 2px #fff, 0 0 0 2px var(--line-2); }
  .ava{ border-radius:50%; background:var(--sand-2); object-fit:cover;
    box-shadow:inset 0 0 0 3px #fff, 0 0 0 3px var(--line-2); }
  .ped{ border-radius:26px 26px 8px 8px; display:grid; place-items:center;
    font-family:var(--font-display); font-weight:800; color:#fff; }
  .rrow{ display:flex; align-items:center; gap:20px; padding:18px 24px; border-radius:24px; background:var(--paper-2);
    box-shadow:var(--shadow-sm), inset 0 0 0 2px #fff, 0 0 0 2px var(--line); }
  .rrow.me{ background:linear-gradient(180deg,#FFF1D2,#FFE9BC); box-shadow:var(--shadow), inset 0 0 0 2px #fff, 0 0 0 3px var(--butter); }
  .rno{ width:54px; text-align:center; font-family:var(--font-display); font-weight:800; font-size:38px; color:var(--ink-mute); }
  .score{ margin-left:auto; font-family:var(--font-display); font-weight:800; font-size:38px; color:var(--ink); font-variant-numeric:tabular-nums; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path class="ic" d="M4 11l8-6 8 6"/><path class="ic" d="M6 10.5v8.5h12v-8.5"/><path class="ic" d="M10 19v-5h4v5"/></symbol>
<symbol id="i-coin" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#F7C156"/><circle cx="24" cy="24" r="21" fill="none" stroke="#DA9B30" stroke-width="3"/><circle cx="24" cy="24" r="15" fill="none" stroke="#FFE7B0" stroke-width="2.5"/><g fill="#fff"><ellipse cx="24" cy="27.5" rx="6.2" ry="5"/><circle cx="18.3" cy="20.5" r="2.5"/><circle cx="24" cy="18.5" r="2.5"/><circle cx="29.7" cy="20.5" r="2.5"/></g></symbol>
</defs></svg>

<div class="stage" style="background:radial-gradient(120% 80% at 50% 0%,#FFF1DC,#FFF7EC 60%)">
  <img class="float" src="assets/desserts/dessert_lv7_cakeroll.png" style="right:30px;top:160px;width:90px;--rot:12deg;opacity:.5" alt="">

  <!-- 顶栏 -->
  <div class="safe-top">
    <div class="row between">
      <button class="iconbtn" aria-label="返回" onclick="location.href='home.html'"><svg><use href="#i-home"/></svg></button>
      <div class="title-lg" style="font-size:48px">排行榜</div>
      <div class="chip" style="height:64px"><svg class="coin"><use href="#i-coin"/></svg>1,280</div>
    </div>
  </div>

  <!-- 切换 -->
  <div class="seg" style="position:absolute;left:60px;right:60px;top:150px">
    <button class="on">好友榜</button>
    <button>全国榜</button>
  </div>

  <!-- 前三领奖台 -->
  <div style="position:absolute;left:50px;right:50px;top:280px;display:flex;align-items:flex-end;justify-content:center;gap:18px">
    <!-- 第2 -->
    <div style="flex:1;text-align:center">
      <img class="ava" src="assets/character/cat_white_happy.png" style="width:128px;height:128px" alt="">
      <div class="h-display" style="font-size:32px;margin-top:10px">奶油</div>
      <div class="mute2" style="font-family:var(--font-display);font-weight:800;font-size:30px">26,540</div>
      <div class="ped" style="height:130px;margin-top:10px;background:linear-gradient(180deg,#CFE3EE,#A9CFE0);font-size:54px">2</div>
    </div>
    <!-- 第1 -->
    <div style="flex:1.05;text-align:center">
      <svg viewBox="0 0 24 24" style="width:56px;height:42px"><path d="M3 18l1.4-9 4.3 3.6L12 5l3.3 7.6L19.6 9 21 18z" fill="#F7C156" stroke="#DA9B30" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="4" r="1.6" fill="#F5879B"/></svg>
      <img class="ava" src="assets/character/cat_orange_happy.png" style="width:152px;height:152px;box-shadow:inset 0 0 0 3px #fff,0 0 0 4px var(--butter)" alt="">
      <div class="h-display" style="font-size:34px;margin-top:10px">棉花糖</div>
      <div style="font-family:var(--font-display);font-weight:800;font-size:32px;color:var(--butter-dp)">28,900</div>
      <div class="ped" style="height:188px;margin-top:10px;background:linear-gradient(180deg,var(--butter-hi),var(--butter));color:#7A4E16;font-size:64px">1</div>
    </div>
    <!-- 第3 -->
    <div style="flex:1;text-align:center">
      <img class="ava" src="assets/character/cat_blue_happy.png" style="width:128px;height:128px" alt="">
      <div class="h-display" style="font-size:32px;margin-top:10px">布丁</div>
      <div class="mute2" style="font-family:var(--font-display);font-weight:800;font-size:30px">24,100</div>
      <div class="ped" style="height:104px;margin-top:10px;background:linear-gradient(180deg,#F0C9B0,#DDAF93);font-size:54px">3</div>
    </div>
  </div>

  <!-- 列表 -->
  <div style="position:absolute;left:50px;right:50px;top:806px;bottom:40px;display:flex;flex-direction:column;gap:16px">
    <div class="rrow"><span class="rno">4</span><img class="ava" src="assets/character/cat_white_idle.png" style="width:78px;height:78px" alt=""><span class="h-display" style="font-size:36px">抹茶</span><span class="score">21,880</span></div>
    <div class="rrow me"><span class="rno" style="color:var(--butter-dp)">5</span><img class="ava" src="assets/character/cat_orange_idle.png" style="width:84px;height:84px" alt=""><div><div class="h-display" style="font-size:36px">我 <span style="font-size:24px;color:var(--butter-dp);font-weight:800">· 本周最佳</span></div></div><span class="score" style="color:var(--butter-dp)">18,640</span></div>
    <div class="rrow"><span class="rno">6</span><img class="ava" src="assets/character/cat_blue_idle.png" style="width:78px;height:78px" alt=""><span class="h-display" style="font-size:36px">可可</span><span class="score">16,200</span></div>
    <div class="rrow"><span class="rno">7</span><img class="ava" src="assets/character/cat_white_happy.png" style="width:78px;height:78px" alt=""><span class="h-display" style="font-size:36px">提拉</span><span class="score">14,950</span></div>
  </div>
</div>

<script src="js/stage.js"></script>
</body>
</html>
