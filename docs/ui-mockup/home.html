<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一起开猫店 · 首页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 统一图标库（暖棕线条 + 爪印猫币）—— 各屏共用 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-gear" viewBox="0 0 24 24"><circle class="ic" cx="12" cy="12" r="3.6"/><g class="ic"><path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/><path d="M5.6 5.6l2.1 2.1"/><path d="M16.3 16.3l2.1 2.1"/><path d="M18.4 5.6l-2.1 2.1"/><path d="M7.7 16.3l-2.1 2.1"/></g></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><g class="ic"><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8.1 10.9l7.8-3.8"/><path d="M8.1 13.1l7.8 3.8"/></g></symbol>
<symbol id="i-rank" viewBox="0 0 24 24"><path class="ic" d="M7 4h10v4a5 5 0 0 1-10 0z"/><path class="ic" d="M7 5H4v1.5a3 3 0 0 0 3 3"/><path class="ic" d="M17 5h3v1.5a3 3 0 0 1-3 3"/><path class="ic" d="M12 13v4"/><path class="ic" d="M8.5 20h7"/><path class="ic" d="M9.5 17h5l.6 3h-6.2z"/></symbol>
<symbol id="i-gift" viewBox="0 0 24 24"><path class="ic" d="M4.5 11h15v8.5h-15z"/><path class="ic" d="M3.5 7.5h17V11h-17z"/><path class="ic" d="M12 7.5v12"/><path class="ic" d="M12 7.5C9.5 7.5 8 5 9.6 3.6 11 2.5 12 5.2 12 7.5z"/><path class="ic" d="M12 7.5c2.5 0 4-2.5 2.4-3.9C13 2.5 12 5.2 12 7.5z"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l13 7-13 7z" fill="currentColor"/></symbol>
<symbol id="i-coin" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#F7C156"/><circle cx="24" cy="24" r="21" fill="none" stroke="#DA9B30" stroke-width="3"/><circle cx="24" cy="24" r="15" fill="none" stroke="#FFE7B0" stroke-width="2.5"/><g fill="#fff"><ellipse cx="24" cy="27.5" rx="6.2" ry="5"/><circle cx="18.3" cy="20.5" r="2.5"/><circle cx="24" cy="18.5" r="2.5"/><circle cx="29.7" cy="20.5" r="2.5"/></g></symbol>
<symbol id="i-chevL" viewBox="0 0 24 24"><path class="ic" stroke-width="3" d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-chevR" viewBox="0 0 24 24"><path class="ic" stroke-width="3" d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path class="ic" d="M4 11l8-6.5 8 6.5"/><path class="ic" d="M6 10v9h12v-9"/><path class="ic" d="M10 19v-5h4v5"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2.4" class="ic"/><path class="ic" d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
</defs></svg>

<div class="stage">
  <img class="stage__bg" src="assets/bg/bg_home.png" alt="">
  <div class="stage__veil"></div>

  <!-- 漂浮甜点装饰 -->
  <img class="float" src="assets/desserts/dessert_lv3_puff.png" style="left:54px;top:300px;width:96px;--rot:-12deg" alt="">
  <img class="float" src="assets/desserts/dessert_lv5_taiyaki.png" style="right:42px;top:360px;width:108px;--rot:14deg;animation-delay:.8s" alt="">
  <img class="float" src="assets/desserts/dessert_lv2_cookie2.png" style="right:88px;top:208px;width:74px;--rot:8deg;animation-delay:1.6s" alt="">

  <!-- 顶部 HUD -->
  <div class="safe-top">
    <div class="row between">
      <div class="chip"><svg class="coin"><use href="#i-coin"/></svg>1,280<span class="plus">＋</span></div>
      <div class="row" style="gap:14px">
        <button class="iconbtn" aria-label="分享"><svg><use href="#i-share"/></svg></button>
        <button class="iconbtn" aria-label="设置" onclick="location.href='settings.html'"><svg><use href="#i-gear"/></svg></button>
      </div>
    </div>
  </div>

  <!-- Logo + 标题 -->
  <div style="position:absolute;left:0;right:0;top:150px;text-align:center">
    <img class="pop" src="assets/ui/logo.png" style="width:300px;filter:drop-shadow(0 10px 14px rgba(120,80,40,.20))" alt="一起开猫店">
    <div class="title-xl" style="margin-top:-6px;font-size:78px;color:#E0657C;text-shadow:0 3px 0 #fff,0 4px 0 rgba(120,80,40,.12)">一起开猫店</div>
    <div class="muted" style="font-size:30px;margin-top:10px;font-weight:600">拖动合成甜点 · 满足每一位猫客</div>
  </div>

  <!-- M4：家园（即将开放）占位 —— PRD 03-ui/07 要求首页有置灰家园预告入口；点击仅提示，不进屏 -->
  <button disabled aria-label="家园（即将开放）"
    style="position:absolute;left:50%;top:492px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:12px;
    height:74px;padding:0 28px;border:none;border-radius:999px;cursor:not-allowed;
    background:var(--sand-2);color:var(--ink-mute);box-shadow:inset 0 0 0 2px var(--line-2);
    font-family:var(--font-display);font-weight:800;font-size:28px">
    <svg style="width:34px;height:34px;color:var(--ink-mute)"><use href="#i-home"/></svg>
    家园 · 即将开放
    <svg style="width:24px;height:24px;color:var(--ink-mute)"><use href="#i-lock"/></svg>
  </button>

  <!-- 关卡选择 -->
  <div class="panel" style="position:absolute;left:90px;right:90px;top:610px;padding:30px 28px;display:flex;align-items:center;justify-content:space-between">
    <button class="iconbtn" aria-label="上一关"><svg><use href="#i-chevL"/></svg></button>
    <div style="text-align:center">
      <div class="mute2" style="font-size:26px;font-weight:700;letter-spacing:2px">第 7 关 / 共 30 关</div>
      <div class="h-display" style="font-size:54px;margin:2px 0 8px">草莓季 · 午后</div>
      <div class="stars" style="--s:1">
        <svg viewBox="0 0 24 24"><path class="star-on" d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.7 6.7 19.4l1.1-5.9L3.5 9.4l5.9-.8z"/></svg>
        <svg viewBox="0 0 24 24"><path class="star-on" d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.7 6.7 19.4l1.1-5.9L3.5 9.4l5.9-.8z"/></svg>
        <svg viewBox="0 0 24 24"><path class="star-off" d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.7 6.7 19.4l1.1-5.9L3.5 9.4l5.9-.8z"/></svg>
      </div>
    </div>
    <button class="iconbtn" aria-label="下一关"><svg><use href="#i-chevR"/></svg></button>
  </div>

  <!-- 开始营业 -->
  <button class="btn btn--primary btn--lg" style="position:absolute;left:90px;right:90px;top:830px;width:auto" onclick="location.href='game.html'">开始营业</button>

  <!-- 次级入口 -->
  <div style="position:absolute;left:90px;right:90px;top:980px;display:flex;gap:22px;justify-content:center">
    <div onclick="location.href='rank.html'" style="flex:1">
      <button class="tool" style="width:100%;height:120px;border-radius:26px"><svg style="width:60px;height:60px"><use href="#i-rank"/></svg></button>
      <div class="muted" style="text-align:center;font-weight:700;font-size:26px;margin-top:10px">排行榜</div>
    </div>
    <div style="flex:1">
      <button class="tool" style="width:100%;height:120px;border-radius:26px"><svg style="width:60px;height:60px"><use href="#i-gift"/></svg><span class="tool__count">1</span></button>
      <div class="muted" style="text-align:center;font-weight:700;font-size:26px;margin-top:10px">每日礼包</div>
    </div>
    <div style="flex:1">
      <button class="tool" style="width:100%;height:120px;border-radius:26px"><svg style="width:58px;height:58px;color:var(--ink)"><use href="#i-coin"/></svg><span class="tool__count is-ad" style="min-width:auto;padding:0 10px">广告</span></button>
      <div class="muted" style="text-align:center;font-weight:700;font-size:26px;margin-top:10px">免费猫币</div>
    </div>
  </div>

  <!-- 招呼客人的橘猫 -->
  <img src="assets/character/cat_orange_idle.png" style="position:absolute;left:18px;bottom:-6px;width:230px;filter:drop-shadow(0 10px 12px rgba(120,80,40,.22))" alt="">
  <img src="assets/character/cat_white_happy.png" style="position:absolute;right:6px;bottom:-10px;width:200px;transform:scaleX(-1);filter:drop-shadow(0 10px 12px rgba(120,80,40,.20))" alt="">
</div>

<script src="js/stage.js"></script>
</body>
</html>
