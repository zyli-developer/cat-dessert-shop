<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cat Bakery E2E Shell</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
  <div id="app" data-scene="Loading">Cat Bakery E2E Shell</div>
  <script src="./app.js"></script>
  <script>
    // Harness hooks for Playwright
    window.__cb = window.__cb || {};
    window.addEventListener('load', () => {
      if (typeof window.CatBakery !== 'undefined') {
        window.__cb = Object.assign(window.__cb, window.CatBakery);
        document.getElementById('app').setAttribute('data-scene', 'Home');
      }
    });
  </script>
</body>
</html>
